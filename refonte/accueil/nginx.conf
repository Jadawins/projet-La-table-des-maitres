# Accueil public de refonte. L’ancienne application et l’API restent sur disque.
server {
    listen 80;
    listen [::]:80;
    server_name myrpgtable.fr www.myrpgtable.fr;
    return 301 https://myrpgtable.fr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.myrpgtable.fr;
    ssl_certificate /etc/letsencrypt/live/myrpgtable.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrpgtable.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://myrpgtable.fr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name myrpgtable.fr;
    ssl_certificate /etc/letsencrypt/live/myrpgtable.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrpgtable.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/www/myrpgtable/shared/logs/nginx-access.log anonymized;
    error_log /var/www/myrpgtable/shared/logs/nginx-error.log;
    root __MAINTENANCE_ROOT__;
    index index.html;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-store, max-age=0" always;
    error_page 503 /index.html;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location = /refonte.css { try_files $uri =404; }
    location = /refonte.js { try_files $uri =404; }
    location = /service-worker.js { try_files $uri =404; }
    location = /connexion.html { try_files $uri =404; }
    location = /connexion.js { try_files $uri =404; }
    location = /inscription.html { try_files $uri =404; }
    location = /inscription.js { try_files $uri =404; }
    location = /signup.html { return 302 /inscription.html; }
    location = /login.html { return 302 /connexion.html; }
    # Ancienne URL de retour OAuth conservée, sans rouvrir l’ancien accueil.
    location = /home.html { return 302 /connexion.html$is_args$args; }
    location = /atelier { return 302 /atelier/; }
    location /atelier/ {
        proxy_pass http://127.0.0.1:4181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Aucun ancien chemin, fichier, upload ou appel API n’est servi publiquement.
    location / { return 503; }
}
