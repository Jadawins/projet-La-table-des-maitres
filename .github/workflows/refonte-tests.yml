name: Refonte - tests
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'refonte/**'
      - 'assets/img/fond-bibliotheque-sombre.png'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install test dependencies
        run: pnpm --dir refonte/e2e install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir refonte/e2e exec playwright install --with-deps chromium
      - name: Unit tests and complete browser journeys
        run: node refonte/e2e/verify.mjs
      - name: Save browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refonte-browser-tests
          path: |
            refonte/e2e/playwright-report/
            refonte/e2e/test-results/
          retention-days: 14
